; Phones: no texture larger than 1024 across. The textures are cooked for Android without their
; larger mips; the game on a computer keeps them.
[Android DeviceProfile]
; What the arena costs on the test phone (Galaxy A16, Mali-G57 MC2), measured there with the game's own
; FPS chart: 18 frames a second as the engine sets a phone up, nearly all of it the graphics chip
; filling pixels. With these it is 31: three quarters of the resolution (the HUD stays sharp), FXAA in
; place of the temporal anti-aliasing (6 frames a second by itself), one shadow cascade, no bloom.
; What is left, of 32 ms a frame: the country round the arena and the sky dome 6.5, shadows 5.5, one
; hero 4, trees and rocks 4, fog and atmosphere 3.5, the water 1, the ground and the rest about 7.
