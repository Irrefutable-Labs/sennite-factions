; In a match, what a faction's built structure takes before it is down: a rule of the game, set here.
[/Script/Sennite.SenniteMatchBases]
StructureHealth=300.0

; Which hero mesh each skin of the publisher's shop is (Server/world/shop.json): the skins the hero ships with.
[/Script/Sennite.SenniteMatch]
; How a match ends: the first faction to KillsToWin kills wins; when MatchSeconds run out the faction
; with the most kills wins, and nobody does when the most is shared; a faction whose base is wiped is
; out, and the last faction left wins. Nothing for KillsToWin or MatchSeconds turns that rule off.
KillsToWin=10
MatchSeconds=600.0
; A hero that falls returns on its faction's base this much later.
RespawnSeconds=5.0
; A game that joined and showed no ticket from the publisher's server in this time is put out.
EnterSeconds=60.0
; The match server closes this long after the publisher's server recorded the outcome.
CloseSeconds=30.0

[/Script/Sennite.SenniteCrate]
; Weapon crates: how many by each base's start and how far from it, how near a hero must be to open
; one, how long until it is full again, and the rounds it gives the hero who opened it. Model is what
; a crate is drawn as (Tools/import_crate.py) and Across how long it is, in cm.
PerBase=2
FromStart=500.0
Reach=250.0
RestockSeconds=45.0
RifleRounds=90
ShotgunShells=20
Model=/Game/Crate/SM_AmmoCrate.SM_AmmoCrate
Across=150.0

