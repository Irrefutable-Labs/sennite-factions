[/Script/Sennite.SenniteArena]
; A negative seed is a different arena every match. ?Seed= and ?Bases= on the map's address say otherwise.
DefaultSeed=-1
DefaultBases=2
BlockShape=/Engine/BasicShapes/Cube.Cube
BaseShape=/Engine/BasicShapes/Cylinder.Cylinder
BlockMaterial=/Game/Arena/M_ArenaBlock.M_ArenaBlock
; The ground of a base: grass (Tools/import_ground.py). Leave it out and a base is drawn plain.
BaseGround=/Game/Scenery/Grass/M_Grass.M_Grass
; The traffic deck and the bridge spans: asphalt. Leave it out and they are drawn plain.
RoadSurface=/Game/Scenery/Asphalt/M_Asphalt.M_Asphalt
; The land far below the arena and its water (Tools/import_land.py), and how far below the bases its
; lake lies, in cm. Leave Land and LandWater out and below the arena is haze. The Arena map's haze is
; set from Land and LandDepth when the map is made: after changing either, make the map again
; (Tools/build_arena.py). The arena check fails on a map whose haze is not on the lake.
Land=/Game/Scenery/Land/SM_Land.SM_Land
LandWater=/Game/Scenery/Land/SM_LandWater.SM_LandWater
LandDepth=60000.0
CraftDamage=20.0
