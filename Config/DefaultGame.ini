; The guns (Tools/import_weapons.py). Each model has its muzzle along +X and its top along +Z, its
; middle at the origin, in cm. GripPoint is where the grip hand's palm closes, OffHandPoint where the
; other hand's does (the foregrip), MuzzleOffset the end of the barrel. DisplayName is what the HUD
; and a crate call it. FireSeconds is how long after a shot before the next, ReloadSeconds how long a
; reload takes; bHeldFires is whether it goes on firing while the button is held. CrateRounds is the
; rounds a crate gives for it each time it is opened. FireSound is what a shot sounds like.
; bFree is whether every player has it from a crate; a gun that is not free is bought in the store
; with D-bucks under its ShopId, and a crate gives it only to a player whose wallet owns it.
