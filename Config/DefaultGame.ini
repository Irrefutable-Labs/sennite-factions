; and a crate call it. FireSeconds is how long after a shot before the next, ReloadSeconds how long a
; reload takes; bHeldFires is whether it goes on firing while the button is held. CrateRounds is the
; rounds a crate gives for it each time it is opened. FireSound is what a shot sounds like.
