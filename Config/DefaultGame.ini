; How many trees and bushes the seed tries to stand on each plot's land, clear of its pad and the ways out.
TreesPerBase=14
BushesPerBase=24
; How each plot is dressed, off its pad: groups of cover rocks on its land (a tall rock and one or two
; lower beside it); cover rocks along each way out, either side of the straight way to the connector;
; outcrops, big rocks on its high ground; crags, its landmark, on the high ground at its back; steel
; frames; small stones; patches of stony ground. Rocks, outcrops and crags are solid by their own
; shapes, and frames stand over blocks: all of them stop heroes and shots.
CoverPerBase=14
CoverPerWay=4
OutcropsPerBase=3
CragsPerBase=1
FramesPerBase=1
StonesPerBase=40
PatchesPerBase=10
; The land past each plot's rim, out to the shore, clear of every plot and connector: rocks of the
; plot's style (some outcrops, some with a low rock beside), patches of stony ground by them, and
; groves of four to seven trees with bushes among them.
OuterRocksPerBase=20
OuterPatchesPerBase=10
GrovesPerBase=8
; A plot is 240 m across; the land between two plots 480 m long and 240 m wide. A built crossing
; (bridges, a tunnel, traffic, floating pieces, a tree-top walk) is 240 m by 120 m in the middle of it.
; Six bases make an arena about 1.9 km across.
BaseRadius=12000.0
ConnectorLength=48000.0
ConnectorWidth=24000.0

[/Script/Sennite.SenniteSounds]
; What the game sounds like (Source/Sennite/Public/SenniteSounds.h). Each sound has a name, its recordings (Takes: one is
; played, never the same twice running), how loud (Volume) and how far it carries when played at a place (Carries: Near,
; Far or Shot, the three falloffs below). The recordings are cut and imported by Tools/cut_sounds.py and import_sounds.py.
NearFalloff=/Game/Sounds/SA_Near.SA_Near
FarFalloff=/Game/Sounds/SA_Far.SA_Far
ShotFalloff=/Game/Sounds/SA_Shot.SA_Shot
; The heroes that speak with the woman's voice and with the man's. Crunch, Howitzer, Rampage and Sevarog are not people: none.
; A voice is heard at a jump, a landing, a hit and a fall, never at an attack or a shot. The owner, 2026-11-18:
; "Voices you pick for the guns are fucking awful."
+WomensVoices=dekker
+MensVoices=wraith
+MensVoices=drongo
+MensVoices=trooper
; cm walked, and run, between two steps heard
WalkStride=140.0
RunStride=210.0
; The air of a map, a sound that goes round for as long as the map is open: none. The owner, 2026-11-18, of the birds
; going round on the menu: "That sound is fucking annoying. Stop it." A map is given one with
; Ambience=(("Menu","air.menu")), every other map with AmbienceElsewhere=air.field; AmbienceVolume is how loud.
AmbienceElsewhere=None
AmbienceVolume=0.5
; The menus' buttons (USenniteSounds::ButtonSound). Two are the owner's own recordings, 2026-11-19: a button pressed and
; a thing done (choose, buy, swap, start) are his menu-button-push, "the main button press sound in the menus and just
; throughout the game ... for approving or going through"; back, leave and the in-game menu closing are his
; menu-button-press-2, "more of a lower register ... For canceling". The smaller ones are all his small-ticks, "use this
; for smaller ticks, like checking something off": a section of the store, the arrows that turn to the next hero, skin
; or gun, one of a row along the bottom, a digit of a keypad, a setting a step less or more, and the base editor's
