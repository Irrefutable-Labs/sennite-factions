; How a match ends: the first faction to KillsToWin kills wins; when MatchSeconds run out the faction
; with the most kills wins, and nobody does when the most is shared; a faction whose base is wiped is
; out, and the last faction left wins. Nothing for KillsToWin or MatchSeconds turns that rule off.
KillsToWin=10
MatchSeconds=600.0
; A hero that falls returns on its faction's base this much later.
