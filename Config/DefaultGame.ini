[/Script/UnrealEd.ProjectPackagingSettings]
PackageCompressionFormat=Oodle
PackageCompressionMethod=Kraken
PackageCompressionLevel_DebugDevelopment=8
PackageCompressionLevel_TestShipping=8
PackageCompressionLevel_Distribution=8

; The sky a match is played under (SenniteSky.h): which one comes from the arena's seed, each as likely
; as its Weight against the others'. DAY is the sky the map is built with. At DUSK the sun is low and
; warm. At NIGHT the sun is the moon, the one light that casts shadows, and the stars are out
; (Tools/build_sky.py). SunHeight is in degrees above the horizon. -Sky=NIGHT on the command line says
; which, for a look.
[/Script/Sennite.SenniteSky]
+Skies=(Name="DAY",Weight=2.0,bAsBuilt=True)
+Skies=(Name="DUSK",Weight=1.0,SunHeight=9.0,SunIntensity=5.0,SunColour=(R=1.0,G=0.8,B=0.62,A=1.0),FillIntensity=1.3,FillColour=(R=1.0,G=0.86,B=0.8,A=1.0),SkyBrightness=30.0,SkyColour=(R=1.0,G=0.6,B=0.42,A=1.0),Haze=(R=0.9,G=0.58,B=0.45,A=1.0),Stars=0.0)
+Skies=(Name="NIGHT",Weight=1.0,SunHeight=38.0,SunIntensity=1.1,SunColour=(R=0.55,G=0.68,B=1.0,A=1.0),FillIntensity=0.6,FillColour=(R=0.45,G=0.58,B=1.0,A=1.0),SkyBrightness=5.0,Haze=(R=0.02,G=0.035,B=0.08,A=1.0),Stars=1.0)
